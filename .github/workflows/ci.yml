name: CI Pipeline with Local Report

on: [push]

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest requests

      - name: Run Tests & Generate Report
        if: always()
        run: |
          pytest --junitxml=result.xml || true

          python -c "
          import requests, os, json, xml.etree.ElementTree as ET
          from datetime import datetime

          passed = 0
          failed = 0
          tests = []
          
          if os.path.exists('result.xml'):
              tree = ET.parse('result.xml')
              root = tree.getroot()
              for ts in root.iter('testsuite'):
                  for tc in ts.iter('testcase'):
                      name = tc.attrib.get('name')
                      failure = tc.find('failure')
                      if failure is not None:
                          failed += 1
                          tests.append({'name': name, 'result': 'failed', 'message': failure.text})
                      else:
                          passed += 1
                          tests.append({'name': name, 'result': 'passed', 'message': None})

          payload = {
              'repository': '${{ github.repository }}',
              'branch': '${{ github.ref_name }}',
              'commit_sha': '${{ github.sha }}',
              'run_id': '${{ github.run_id }}',
              'timestamp': datetime.utcnow().isoformat(),
              'tests': tests,
              'summary': {
                  'total': passed + failed,
                  'passed': passed,
                  'failed': failed,
                  'status': 'passed' if failed == 0 else 'failed'
              }
          }

          url = '${{ secrets.RECEIVER_URL }}'
          if url:
              try:
                  requests.post(url, json=payload, timeout=10)
                  print('Report successfully sent to receiver')
              except Exception as e:
                  print('Failed to send report:', e)
          "

      - name: Enforce Test Success
        run: |
          pytest
          - name: Send Email Notification
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "CI/CD Pipeline Report: ${{ job.status }}"
        to: ${{ secrets.MAIL_USERNAME }}
        from: GitHub Actions CI
        body: |
          Hello Khubaib,
          
          GitHub Actions workflow execution completed!
          Status: ${{ job.status }}
          Repository: ${{ github.repository }}
          Commit SHA: ${{ github.sha }}